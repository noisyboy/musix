<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
  <script src="main.js"></script>
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadmium ---Music-Player</title>
    <link rel="stylesheet" href="style.css">
 
</head>
<body>

    <div class="glass-card" id="main-card">
        <div class="brand-logo" title="Cadmium (Cd - 48)">
        <span class="brand-number">48</span>
        <span class="brand-symbol">Cd</span>
    </div>
        <!-- 3-Slide Swipeable Viewport -->
        <div class="carousel-viewport" id="carousel">
            
            <!-- Slide 0 (Left): Synced Auto-scrolling Lyrics -->
            <div class="carousel-slide">
                <div class="lyrics-container" id="lyrics-container">
                    <div id="lyrics-content" style="opacity: 0.6;">Swipe here when song starts playing...</div>
                </div>
            </div>

            <!-- Slide 1 (Center): Album Art Thumbnail -->
            <div class="carousel-slide" id="album-art-container">
                <svg viewBox="0 0 24 24">
                    <path d="M9 18V5l12-2v13M9 9l12-2M9 18c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm12-2c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <!-- Slide 2 (Right): Playlist Drawer -->
            <div class="carousel-slide">
     <!-- Slide 3 (Right): Direct Video Queues -->
<div class="playlist-drawer">
    <div class="playlist-drawer-title">Select Playlist</div>
    <button class="playlist-chip active" onclick="switchPlaylist(MUSIC_DB.default, this)">Hindi-Indi</button>
    <button class="playlist-chip" onclick="switchPlaylist(MUSIC_DB.hiphop_classics, this)">Hip Hop Classics</button>
    <button class="playlist-chip" onclick="switchPlaylist(MUSIC_DB.violin_classics, this)">Violin Classics</button>
    <button class="playlist-chip" onclick="switchPlaylist(MUSIC_DB.lofi_chill, this)">Lofi Chillhop</button>
</div>
            </div>

        </div>

        <!-- Carousel Indicators -->
        <div class="carousel-dots">
            <div class="dot" id="dot-0"></div>
            <div class="dot active" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
        </div>

        <!-- Track Info -->
        <div class="track-info">
            <h2 class="track-title" id="track-title">Loading Playlist...</h2>
            <p class="track-artist">YouTube Audio Stream</p>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar-bg" id="progress-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>

        <!-- Playback Controls -->
        <div class="playback-controls">
            <button class="icon-btn" id="btn-shuffle" onclick="toggleShuffle()">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            
            <button class="icon-btn" onclick="player.previousVideo()">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            
            <button class="icon-btn play-pause-btn" id="play-pause-btn" onclick="togglePlayPause()">
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            
            <button class="icon-btn" onclick="player.nextVideo()">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>

            <button class="icon-btn" id="btn-loop" onclick="toggleLoop()">
                <svg id="icon-loop" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                <svg id="icon-loop-one" viewBox="0 0 24 24" style="display: none;"><path d="M13 15V9h-1l-2 1.5v1.25l2-1.5h1V15h1zm-1-11V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            </button>
        </div>
    </div>

    <div id="player-container"></div>

    <script>

    </script>
</body>
</html>
